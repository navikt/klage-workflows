name: Build App
description: Build and push Docker image for a Java/Gradle application

inputs:
  build-tag:
    description: 'Tag/branch/ref to build'
    required: false
    default: main
  java-version:
    description: 'Java version used for the build JDK'
    required: false
    default: '21'
  gradle-encryption-key:
    description: 'Gradle cache encryption key'
    required: true
  github-token:
    description: 'GitHub token for Gradle'
    required: true

outputs:
  tag:
    description: 'Docker image tag'
    value: ${{ steps.docker-build-push.outputs.tag }}
  image:
    description: 'Full Docker image path'
    value: ${{ steps.docker-build-push.outputs.image }}

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.build-tag == '' && github.ref_name || inputs.build-tag }}
    - name: Install build JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        cache-overwrite-existing: true
        cache-encryption-key: ${{ inputs.gradle-encryption-key }}
    - name: Build and test
      shell: bash
      run: ./gradlew build
      env:
        ORG_GRADLE_PROJECT_githubUser: x-access-token
        ORG_GRADLE_PROJECT_githubPassword: ${{ inputs.github-token }}
    - name: Build & push Docker image
      uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
      id: docker-build-push
      with:
        team: klage
        tag: ${{ github.sha }}
        build_args: |
          VERSION=${CI}
    - name: Log Docker image tag
      shell: bash
      run: echo "Docker image tag = ${{ steps.docker-build-push.outputs.tag }}"