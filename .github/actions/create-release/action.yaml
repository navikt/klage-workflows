name: Create GitHub Release
description: Create a GitHub release with a tag

inputs:
  tag:
    description: 'Tag for the release'
    required: true

runs:
  using: composite
  steps:
    - name: Create release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        tag: ${{ inputs.tag }}