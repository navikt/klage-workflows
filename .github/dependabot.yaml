version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
      time: "03:00"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
